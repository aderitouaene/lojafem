<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Essência | Moda, Beleza e Conhecimento</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#FEFCFB;--text:#2B2B2B;--muted:#8A8A8A;--accent:#D4AF7A;--accent-light:#F5EFE6;--card:#FFF;--border:#F0EDE8;--radius:14px;--font-serif:'Playfair Display',serif;--font-sans:'Inter',sans-serif}
    *{margin:0;padding:0;box-sizing:border-box} body{font-family:var(--font-sans);background:var(--bg);color:var(--text)}
  .container{max-width:1300px;margin:0 auto;padding:2rem 1rem}
  .header{position:sticky;top:0;background:rgba(254,252,251,0.95);backdrop-filter:blur(10px);z-index:100;border-bottom:1px solid var(--border)}
  .nav{display:flex;align-items:center;justify-content:space-between;max-width:1300px;margin:0 auto;padding:1rem}
  .logo{font-family:var(--font-serif);font-size:1.8rem;font-weight:500;letter-spacing:4px;color:var(--accent)}
  .menu-categorias{display:flex;gap:1.8rem;font-size:0.85rem;flex-wrap:wrap}
  .menu-categorias a{color:var(--muted)}.menu-categorias a:hover{color:var(--accent)}
  .banner{height:380px;background:linear-gradient(rgba(43,43,43,0.3)),url('https://images.unsplash.com/photo-1522337360788-45949970b2a8?q=80&w=1300') center/cover;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center}
  .banner-content h1{font-family:var(--font-serif);font-size:3rem;font-weight:400;letter-spacing:6px}
  .section-title{font-family:var(--font-serif);font-size:1.6rem;font-weight:400;margin:2.5rem 0 1.2rem;text-align:center}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1rem}
  .card{background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);cursor:pointer;transition:0.3s}
  .card:hover{transform:translateY(-3px)}.card-img{aspect-ratio:3/4;position:relative}
  .card-img img{width:100%;height:100%;object-fit:cover}
  .badge{position:absolute;top:6px;left:6px;background:var(--accent-light);color:var(--accent);padding:0.2rem 0.5rem;border-radius:20px;font-size:0.6rem;font-weight:600}
  .badge.digital{background:#E8F5E9;color:#2E7D32}.badge.promo{background:#FFE8E8;color:#C94C4C}
  .card-body{padding:0.6rem}.card-category{font-size:0.65rem;color:var(--muted);text-transform:uppercase}
  .card-title{font-size:0.8rem;font-weight:500;margin:0.2rem 0;height:2.2em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .price{font-size:0.85rem;font-weight:600;color:var(--accent)}
  .btn{width:100%;padding:0.5rem;margin-top:0.4rem;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;font-size:0.7rem}
  .btn:hover{background:var(--accent);color:#fff}
  .footer{background:var(--text);color:var(--bg);padding:3rem 1rem;margin-top:3rem;text-align:center}
    @media(max-width:768px){.grid{grid-template-columns:repeat(3, 1fr)}.menu-categorias{display:none}.banner-content h1{font-size:2rem}}
  </style>
</head>
<body>
  <header class="header"><nav class="nav"><a href="#" class="logo">ESSÊNCIA</a><div class="menu-categorias" id="menu-categorias"></div></nav></header>
  <section class="banner"><div class="banner-content"><h1>ESSÊNCIA</h1><p>ELEGÂNCIA EM CADA DETALHE</p></div></section>
  <main class="container" id="app">Carregando produtos...</main>
  <footer class="footer"><h3>ESSÊNCIA</h3><p>Moda, Beleza, Skincare e Conhecimento</p></footer>

<script>
let PRODUCTS = [];

async function loadProducts(){
  try{
    const res = await fetch('products.json'); // LÊ DO ARQUIVO
    PRODUCTS = await res.json();
  }catch(e){
    PRODUCTS = []; // Se não achar o json, fica vazio
  }
  renderHome();
}

function renderHome(){ /* MESMA FUNÇÃO DA VERSÃO ANTERIOR */
  renderCategorias();
  document.getElementById('app').innerHTML = `
    ${renderSection('Mais Vendidos', PRODUCTS.filter(p=>p.tags.includes('mais-vendido')))}
    ${renderSection('Lançamentos', PRODUCTS.filter(p=>p.tags.includes('novo')))}
    ${renderSection('Promoções', PRODUCTS.filter(p=>p.promoPrice))}
    ${renderSection('Todos os Produtos', PRODUCTS)}
  `;
}
function renderCategorias(){ const cats = [...new Set(PRODUCTS.map(p=>p.category))]; document.getElementById('menu-categorias').innerHTML = cats.map(c=>`<a href="#" onclick="filtrarCat('${c}')">${c}</a>`).join('');}
function filtrarCat(cat){ const itens = PRODUCTS.filter(p=>p.category===cat); document.getElementById('app').innerHTML = `<h2 class="section-title">${cat}</h2>${renderGrid(itens)}<button onclick="loadProducts()" style="margin-top:2rem;padding:0.6rem 1rem;border:1px solid var(--accent);background:transparent">← Voltar</button>`;}
function renderSection(title, items){ if(!items.length) return ''; return `<section><h2 class="section-title">${title}</h2>${renderGrid(items.slice(0,8))}</section>`;}
function renderGrid(items){ return `<div class="grid">${items.map(p=>`<div class="card" onclick="window.open('${p.affiliateLink}','_blank')"><div class="card-img"><img src="${p.images[0]}" loading="lazy">${p.type==='digital'?'<span class="badge digital">DIGITAL</span>':''}${p.promoPrice?'<span class="badge promo">PROMO</span>':''}</div><div class="card-body"><p class="card-category">${p.category}</p><h3 class="card-title">${p.name}</h3><p class="price">R$ ${(p.promoPrice||p.price).toFixed(2)}</p><button class="btn">Comprar</button></div></div>`).join('')}</div>`;}
document.addEventListener('DOMContentLoaded',loadProducts);
</script>
</body>
</html>
